dependencies {
	implementation 'com.fazecast:jSerialComm:[2.0.0,3.0.0)'
	implementation 'org.slf4j:slf4j-api:2.0.6'
	implementation 'ch.qos.logback:logback-classic:1.4.5'
	implementation 'commons-cli:commons-cli:1.5.0'

	// Tests unitaires (logique pure, sans port serie ni reseau reel -- voir
	// src/test/java, ex: SignalWatchdog, NetworkStatusUtil).
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
//	implementation group: 'de.dfki.mary', name: 'voice-cmu-slt-hsmm', version: '5.2.1', {
//		exclude group: 'com.twmacinta', module: 'fast-md5'
//		exclude group: 'gov.nist.math', module: 'Jampack'
//	}
//	implementation group: 'de.dfki.mary', name: 'marytts-lang-fr', version: '5.2.1', {
//		exclude group: 'com.twmacinta', module: 'fast-md5'
//		exclude group: 'gov.nist.math', module: 'Jampack'
//	}
//	implementation group: 'javazoom', name: 'jlayer', version: '1.0.1'
}

test {
	useJUnitPlatform()
}

// Numero de build (horodatage genere a chaque build) affiche sur la page de
// supervision web, pour verifier facilement quelle version du code tourne
// reellement sur la Pi (voir com.edaxortho.interphone.web.BuildInfo).
def buildTimestamp = new Date().format("yyyyMMddHHmmss")

sourceSets {
	main {
		resources {
			srcDir "$buildDir/generated/resources"
		}
	}
}

task generateBuildInfo {
	def outputDir = file("$buildDir/generated/resources")
	outputs.dir(outputDir)
	doLast {
		outputDir.mkdirs()
		new File(outputDir, "build-info.properties").text =
				"BUILD_NUMBER=${buildTimestamp}\n" +
				"PROJECT_VERSION=${project.version}\n"
	}
}

processResources.dependsOn generateBuildInfo
