<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervision PortierGSM</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 16px 0;
  }
  h2 {
    font-size: 1rem;
    margin: 0 0 12px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    max-width: 720px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .signal-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .signal-badge {
    font-size: 1.6rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 8px;
    color: #fff;
  }
  .signal-badge.good { background: var(--good); }
  .signal-badge.warn { background: var(--warn); }
  .signal-badge.bad { background: var(--bad); }
  .signal-badge.unknown { background: var(--muted); }
  .signal-meta { color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
  .range-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
  .range-buttons button {
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .range-buttons button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  canvas { width: 100%; height: 160px; display: block; }
  .chart-empty { color: var(--muted); font-size: 0.85rem; padding: 20px 0; text-align: center; }
  table.hours { width: 100%; border-collapse: collapse; }
  table.hours th, table.hours td {
    padding: 6px 4px;
    text-align: left;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border);
  }
  table.hours th { color: var(--muted); font-weight: 500; }
  input[type="time"] {
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    width: 100%;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    color: #fff;
  }
  .btn-primary { background: var(--accent); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: var(--danger-dark); }
  .actions { margin-top: 14px; display: flex; justify-content: flex-end; }
  .status-msg { font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
  .status-msg.ok { color: var(--good); }
  .status-msg.error { color: var(--bad); }
  .reboot-desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="grid">
  <h1>Supervision PortierGSM</h1>

  <div class="card">
    <h2>Qualité du signal</h2>
    <div class="signal-row">
      <div id="signal-badge" class="signal-badge unknown">--</div>
      <div class="signal-meta">
        <div id="signal-dbm">Signal inconnu</div>
        <div id="signal-updated">Dernière mesure : --</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Historique du signal</h2>
    <div class="range-buttons">
      <button data-days="1">24 h</button>
      <button data-days="7" class="active">7 jours</button>
      <button data-days="30">30 jours</button>
    </div>
    <canvas id="chart" width="640" height="160"></canvas>
    <div id="chart-empty" class="chart-empty" style="display:none">Pas encore assez de mesures.</div>
  </div>

  <div class="card">
    <h2>Horaires d'ouverture</h2>
    <form id="hours-form">
      <table class="hours">
        <thead><tr><th>Jour</th><th>Ouverture</th><th>Fermeture</th></tr></thead>
        <tbody id="hours-body"></tbody>
      </table>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
      <div id="hours-status" class="status-msg"></div>
    </form>
  </div>

  <div class="card">
    <h2>Redémarrage</h2>
    <div class="reboot-desc">Redémarre complètement la Raspberry Pi (coupure du service pendant environ une minute).</div>
    <div class="actions">
      <button id="reboot-btn" class="btn btn-danger">Redémarrer la Raspberry Pi</button>
    </div>
    <div id="reboot-status" class="status-msg"></div>
  </div>
</div>

<script>
  var DAYS = [
    ["MONDAY", "Lundi"], ["TUESDAY", "Mardi"], ["WEDNESDAY", "Mercredi"],
    ["THURSDAY", "Jeudi"], ["FRIDAY", "Vendredi"], ["SATURDAY", "Samedi"], ["SUNDAY", "Dimanche"]
  ];

  function qualityClass(csq) {
    if (csq === null || csq === undefined) return "unknown";
    if (csq >= 15) return "good";
    if (csq >= 10) return "warn";
    return "bad";
  }

  function fetchStatus() {
    fetch("/api/status").then(function (r) { return r.json(); }).then(function (data) {
      var badge = document.getElementById("signal-badge");
      badge.textContent = data.csq === null ? "--" : data.csq;
      badge.className = "signal-badge " + qualityClass(data.csq);

      document.getElementById("signal-dbm").textContent =
        (data.quality || "Inconnu") + (data.dbm !== null ? " (" + data.dbm + " dBm)" : "");
      document.getElementById("signal-updated").textContent =
        "Dernière mesure : " + (data.lastUpdate ? formatTs(data.lastUpdate) : "aucune pour le moment");

      var tbody = document.getElementById("hours-body");
      tbody.innerHTML = "";
      DAYS.forEach(function (d) {
        var key = d[0], label = d[1];
        var entry = (data.openingHours && data.openingHours[key]) || {open: "", close: ""};
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + label + "</td>" +
          "<td><input type=\"time\" name=\"" + key + "_OPEN\" value=\"" + entry.open + "\"></td>" +
          "<td><input type=\"time\" name=\"" + key + "_CLOSE\" value=\"" + entry.close + "\"></td>";
        tbody.appendChild(tr);
      });
    }).catch(function (e) {
      console.error("Erreur /api/status", e);
    });
  }

  function formatTs(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString("fr-FR");
    } catch (e) {
      return iso;
    }
  }

  var currentDays = 7;

  function fetchHistory(days) {
    currentDays = days;
    document.querySelectorAll(".range-buttons button").forEach(function (btn) {
      btn.classList.toggle("active", parseInt(btn.getAttribute("data-days"), 10) === days);
    });
    fetch("/api/history?days=" + days).then(function (r) { return r.json(); }).then(function (data) {
      drawChart(data.measurements || []);
    }).catch(function (e) {
      console.error("Erreur /api/history", e);
    });
  }

  function drawChart(measurements) {
    var canvas = document.getElementById("chart");
    var emptyMsg = document.getElementById("chart-empty");
    var ctx = canvas.getContext("2d");

    var cssWidth = canvas.clientWidth || 640;
    canvas.width = cssWidth;
    canvas.height = 160;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!measurements.length) {
      canvas.style.display = "none";
      emptyMsg.style.display = "block";
      return;
    }
    canvas.style.display = "block";
    emptyMsg.style.display = "none";

    var padding = 24;
    var w = canvas.width - padding * 2;
    var h = canvas.height - padding * 2;
    var maxCsq = 31;

    // axes
    ctx.strokeStyle = "#e5e7eb";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, padding);
    ctx.lineTo(padding, padding + h);
    ctx.lineTo(padding + w, padding + h);
    ctx.stroke();

    var n = measurements.length;
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 2;
    ctx.beginPath();
    measurements.forEach(function (m, i) {
      var x = padding + (n === 1 ? w : (w * i) / (n - 1));
      var csq = Math.min(m.csq, maxCsq);
      var y = padding + h - (h * csq) / maxCsq;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = "#6b7280";
    ctx.font = "11px sans-serif";
    ctx.fillText(formatTs(measurements[0].ts), padding, canvas.height - 4);
    var lastLabel = formatTs(measurements[n - 1].ts);
    ctx.fillText(lastLabel, canvas.width - padding - ctx.measureText(lastLabel).width, canvas.height - 4);
  }

  document.querySelectorAll(".range-buttons button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      fetchHistory(parseInt(btn.getAttribute("data-days"), 10));
    });
  });

  document.getElementById("hours-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var statusEl = document.getElementById("hours-status");
    statusEl.textContent = "Enregistrement...";
    statusEl.className = "status-msg";

    var params = new URLSearchParams();
    DAYS.forEach(function (d) {
      var key = d[0];
      params.append(key + "_OPEN", document.querySelector("[name='" + key + "_OPEN']").value);
      params.append(key + "_CLOSE", document.querySelector("[name='" + key + "_CLOSE']").value);
    });

    fetch("/api/hours", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: params.toString()
    }).then(function (r) {
      if (r.ok) {
        statusEl.textContent = "Horaires enregistrés.";
        statusEl.className = "status-msg ok";
      } else {
        return r.text().then(function (t) { throw new Error(t); });
      }
    }).catch(function (e) {
      statusEl.textContent = "Erreur : " + e.message;
      statusEl.className = "status-msg error";
    });
  });

  document.getElementById("reboot-btn").addEventListener("click", function () {
    if (!confirm("Redémarrer la Raspberry Pi maintenant ? Le portier sera indisponible pendant environ une minute.")) {
      return;
    }
    var statusEl = document.getElementById("reboot-status");
    statusEl.textContent = "Redémarrage en cours...";
    statusEl.className = "status-msg";
    fetch("/api/reboot", {method: "POST"}).then(function (r) {
      if (r.ok) {
        statusEl.textContent = "Redémarrage lancé. La page ne répondra plus pendant quelques instants.";
        statusEl.className = "status-msg ok";
      } else {
        return r.text().then(function (t) { throw new Error(t); });
      }
    }).catch(function (e) {
      statusEl.textContent = "Erreur : " + e.message;
      statusEl.className = "status-msg error";
    });
  });

  fetchStatus();
  fetchHistory(currentDays);
  setInterval(fetchStatus, 30000);
</script>
</body>
</html>
