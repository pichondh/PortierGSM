# Sur Raspberry Pi (prod), identifié via `screen /dev/ttyUSBx 115200` + test AT+CLIP + appel réel.
# A vérifier à chaque changement de module : l'énumération USB peut différer d'un module à l'autre
# (ex: A7670E -> /dev/ttyUSB1, SIM7600E-H -> /dev/ttyUSB2 sur la Pi de prod au 11/09/2026).
PORT_COM=/dev/ttyUSB2
# Vitesse du port série AT. SIM7600E-H (4G, actuel) : 115200 (defaut). Ancien A7670E : 115200 aussi. Ancien SIM800 (2G) : 9600.
BAUD_RATE=115200
CODE_PIN=9563
POWER_SCRIPT=/home/pi/GSM_PWR.py

# Page de supervision web (qualite du signal + historique, horaires
# d'ouverture, redemarrage). Reseau local uniquement -- ne pas exposer ce
# port sur Internet. Voir la section "Page de supervision web" du README.
WEB_PORT=8080
WEB_USERNAME=admin
# A CHANGER avant mise en prod : mot de passe de la page de supervision.
WEB_PASSWORD=changeme
SIGNAL_HISTORY_RETENTION_DAYS=30
CALL_LOG_RETENTION_DAYS=30

# Watchdog logiciel : nombre de tests de signal (AT+CSQ, ~1/min) sans
# reponse exploitable du module avant de considerer qu'il est fige/muet et
# de redemarrer automatiquement la Raspberry Pi (meme action que le bouton
# de la page de supervision). Ajoute suite a l'incident du 12/09/2026 :
# module reste muet 5h+ sans que l'application ne plante ni ne le
# remarque elle-meme. Voir README, section "Watchdog".
WATCHDOG_MAX_FAILURES=3

# Purge preventive de la memoire SMS du module (AT+CMGD=1,4), toutes les
# SMS_PURGE_INTERVAL_MINUTES minutes. L'application n'utilise pas les SMS ;
# une memoire pleine ("+SMS FULL" observe dans les logs) est un suspect
# plausible de blocage du dialogue AT avec le module.
SMS_PURGE_INTERVAL_MINUTES=60

MONDAY_OPEN=08:00
MONDAY_CLOSE=18:00

TUESDAY_OPEN=08:00
TUESDAY_CLOSE=18:00

WEDNESDAY_OPEN=08:00
WEDNESDAY_CLOSE=18:00

THURSDAY_OPEN=08:00
THURSDAY_CLOSE=18:00

FRIDAY_OPEN=08:00
FRIDAY_CLOSE=18:00

SATURDAY_OPEN=08:00
SATURDAY_CLOSE=12:00

SUNDAY_OPEN=12:00
SUNDAY_CLOSE=12:00

SYNTHESE_VOCALE=false
TEXTE_FERMETURE=It's closed !