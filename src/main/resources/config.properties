# Sur Raspberry Pi (prod), identifié via `screen /dev/ttyUSBx 115200` + test AT+CLIP + appel réel.
# A vérifier à chaque changement de module : l'énumération USB peut différer d'un module à l'autre
# (ex: A7670E -> /dev/ttyUSB1, SIM7600E-H -> /dev/ttyUSB2 sur la Pi de prod au 11/09/2026).
PORT_COM=/dev/ttyUSB2
# Vitesse du port série AT. SIM7600E-H (4G, actuel) : 115200 (defaut). Ancien A7670E : 115200 aussi. Ancien SIM800 (2G) : 9600.
BAUD_RATE=115200
CODE_PIN=9563
POWER_SCRIPT=/home/pi/GSM_PWR.py

MONDAY_OPEN=08:00
MONDAY_CLOSE=18:00

TUESDAY_OPEN=08:00
TUESDAY_CLOSE=18:00

WEDNESDAY_OPEN=08:00
WEDNESDAY_CLOSE=18:00

THURSDAY_OPEN=08:00
THURSDAY_CLOSE=18:00

FRIDAY_OPEN=08:00
FRIDAY_CLOSE=18:00

SATURDAY_OPEN=08:00
SATURDAY_CLOSE=12:00

SUNDAY_OPEN=12:00
SUNDAY_CLOSE=12:00

SYNTHESE_VOCALE=false
TEXTE_FERMETURE=It's closed !